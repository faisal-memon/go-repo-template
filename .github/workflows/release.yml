name: Release Build

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump and write semantic version tag
        id: bump
        uses: faisal-memon/pr-label-semver@v0
        with:
          github-token: ${{ github.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.new-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move floating major tag
        run: |
          git tag -f "${{ steps.bump.outputs.major-tag }}" "${{ github.sha }}"
          git push --force origin "refs/tags/${{ steps.bump.outputs.major-tag }}"
